[project]
name = "looppp"
version = "0.1.0"
description = "Agent loop on WSL writes GPU kernels; a molab RTX PRO 6000 notebook grades them; W&B carries the queue and results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.24.2",
    "openai>=3.13.0",
    "pyyaml>=6.0.3",
    "wandb>=0.30.0",
    "weave>=0.53.9",
]

[project.scripts]
looppp = "looppp.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
