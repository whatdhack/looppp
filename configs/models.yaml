# W&B Inference models (https://api.inference.wandb.ai/v1). Run `looppp smoke-llm --model <id>`
# before a real loop: output length and reasoning behaviour differ per model.

defaults:
  max_tokens: 32000        # reasoning models spend part of this on hidden thinking
  max_tokens_cap: 96000    # empty/truncated replies are retried with doubled max_tokens up to this
  temperature: 0.7
  timeout_seconds: 900

models:
  zai-org/GLM-5.2: {}
  zai-org/GLM-5.3-Flash: {}
  moonshotai/Kimi-K2.7-Code: {}
  deepseek-ai/DeepSeek-V4-Pro-0813: {}
  deepseek-ai/DeepSeek-V4-Flash-0731: {}
  MiniMaxAI/MiniMax-M3: {}
  nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B: {}
  openai/gpt-oss-120b:
    extra_body:
      reasoning_effort: high
